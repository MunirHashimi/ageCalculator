<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Age Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
   <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4 bg-white">
          <h2 class="text-center mb-4">Age Calculator</h2>
          <div class="mb-3">
            <label for="date" class="form-label">Select your birthdate</label>
            <input type="date" class="form-control" id="date">
          </div>
          <div class="d-grid">
            <button class="btn btn-primary" onclick="CalculateAge()">Calculate Age</button>
          </div>
          <div class="mt-4 text-center" id="result"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
